# One command: cp .env.example .env && docker compose up --build
#   web  -> http://localhost:3000            (React build served by nginx, proxies /api to the API)
#   api  -> http://localhost:8000/api/v1     (Swagger UI at /api/v1/docs)
#   db   -> localhost:5432                   (PostgreSQL, loopback only)
# Images are fully qualified so they also resolve under Podman.
name: finpilot

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-finpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finpilot}
      DATA_DIR: /data
      SEED_ON_START: "true"
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: on-failure:5

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
